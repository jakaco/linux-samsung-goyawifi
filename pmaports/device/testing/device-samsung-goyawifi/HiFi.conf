SectionVerb {
 Value {
  TQ "HiFi"
 }
}
SectionDevice."Speaker" {
 Comment "Built-in speaker"
 EnableSequence [ cset "name='Speaker Playback Switch' on" ]
 DisableSequence [ cset "name='Speaker Playback Switch' off" ]
 Value {
  PlaybackPCM "hw:${CardId}"
  PlaybackChannels 2
  PlaybackRate 44100
  PlaybackMixerElem "Speaker"
  PlaybackPriority 100
 }
}
SectionDevice."Headphones" {
 Comment "Wired headphones"
 EnableSequence [ cset "name='Speaker Playback Switch' off" ]
 Value {
  PlaybackPCM "hw:${CardId}"
  PlaybackChannels 2
  PlaybackRate 44100
  PlaybackMixerElem "Headphone"
  PlaybackPriority 200
  JackControl "Headphone Jack"
 }
}
SectionDevice."Mic" {
 Comment "Built-in microphone"
 EnableSequence [ cset "name='Capture Source' 0" ]
 ConflictingDevice [ "HeadsetMic" ]
 Value {
  CapturePCM "hw:${CardId}"
  CaptureChannels 2
  CaptureRate 44100
  CaptureMixerElem "Mic"
  CapturePriority 100
 }
}
SectionDevice."HeadsetMic" {
 Comment "Wired headset microphone (manual selection)"
 EnableSequence [ cset "name='Capture Source' 2" ]
 ConflictingDevice [ "Mic" ]
 Value {
  CapturePCM "hw:${CardId}"
  CaptureChannels 2
  CaptureRate 44100
  CaptureMixerElem "Mic"
  CapturePriority 50
 }
}
